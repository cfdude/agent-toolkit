[project]
name = "datacommons-mcp"
dynamic = ["version"]
description = "Data Commons MCP server."
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "fastmcp",
    "requests",
    "datacommons-client",
    "pydantic>=2.11.7",
    "pydantic-settings",
    "python-dateutil>=2.9.0.post0",
]

[project.urls]
Homepage = "https://github.com/datacommonsorg/agent-toolkit"

[project.optional-dependencies]
sse = [
    "sse-starlette>=1.0.0",
]
tokens = [
    "tiktoken>=0.5.0",
]
all = [
    "sse-starlette>=1.0.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
datacommons-mcp = "datacommons_mcp.cli:cli"

[build-system]
requires = ["uv", "setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["datacommons_mcp*"]

[tool.setuptools.package-data]
datacommons_mcp = ["**/*.json"]

[tool.setuptools.dynamic]
version = {attr = "datacommons_mcp.version.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: mark test as end-to-end (requires DC_API_KEY)",
    "slow: mark test as slow (large datasets)",
]
